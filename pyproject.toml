[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "itj"
dynamic = ["version"]
description = "A jet toy and tools for learning representations and interpretability of jet taggers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "<AUTHOR>" }]
requires-python = ">=3.10"
keywords = [
    "jet tagging",
    "jet substructure",
    "representation learning",
    "interpretability",
    "self-supervised learning",
    "particle physics",
    "teaching",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "pyarrow>=14",
    "torch>=2.1",
]

[project.optional-dependencies]
analysis = [
    "awkward>=2.5",
    "ipykernel>=6.25",
    "jupyterlab>=4.0",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "pillow>=10.0",
    "scikit-learn>=1.3",
    "uproot>=5.1",
]
# Optional helpers; no core question needs them.
ml = [
    "umap-learn>=0.5.5",
]
# Python 3.10-3.13 in practice; install torch first.
weaver = [
    "weaver-core==0.5.4",
]
dev = [
    "mypy>=1.10",
    "nbclient>=0.10",
    "nbstripout>=0.7",
    "pre-commit>=3.5",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",
    "ruff>=0.17",
]

[project.scripts]
jetgen = "itj.toy.cli:main"

[project.urls]
Homepage = "https://github.com/hqucms/inside-the-jet"
Repository = "https://github.com/hqucms/inside-the-jet"
Issues = "https://github.com/hqucms/inside-the-jet/issues"
Changelog = "https://github.com/hqucms/inside-the-jet/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/itj/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/CHANGELOG.md", "/CITATION.cff", "/LICENSE", "/NOTICE.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/itj"]

# ---------------------------------------------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["examples/weaver/networks/*"]  # verbatim copies of the particle_transformer examples
force-exclude = true  # pre-commit passes file names: honour the excludes for them too

[tool.ruff.format]
exclude = ["src/itj/models/part.py", "src/itj/models/particlenet.py"]  # vendored: keep the line structure

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "C4",   # comprehensions
    "D",    # docstrings (NumPy convention)
    "NPY",  # NumPy-specific rules
    "PT",   # pytest style
    "RUF",  # ruff-specific rules
    "SIM",  # simplifications
    "UP",   # pyupgrade
]
ignore = [
    "D105",  # magic methods need no docstring
    "D107",  # __init__ is documented in the class docstring
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["itj.toy.config._param"]  # dataclass field helper

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"src/itj/models/part.py" = ["D", "B", "SIM", "C4", "RUF", "E501"]  # vendored from weaver-core v0.5.4
"src/itj/models/particlenet.py" = ["D", "B", "SIM", "C4", "RUF", "E501"]  # vendored from weaver-core v0.5.4

# ---------------------------------------------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.10"
files = ["src"]
exclude = ["examples/weaver/networks"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "awkward",
    "fastjet",
    "matplotlib",
    "matplotlib.*",
    "pandas",
    "pyarrow",
    "pyarrow.*",
    "sklearn.*",
    "umap",
    "uproot",
    "weaver.*",
    "yaml",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["itj.models.part", "itj.models.particlenet"]
disallow_untyped_defs = false

# -------------------------------------------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--doctest-modules",
    "-m",
    "not slow and not weaver and not network",
]
markers = [
    "slow: physics validation, timing and notebook tests (run with `pytest -m slow`)",
    "weaver: needs the weaver extra (run with `pytest -m weaver`)",
    "network: downloads files from the internet (run with `pytest -m network`)",
]
xfail_strict = true

# ------------------------------------------------------------------------------------------------------------ coverage
[tool.coverage.run]
source = ["itj"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
