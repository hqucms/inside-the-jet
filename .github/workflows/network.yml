name: Network

# The downloads of `jetgen fetch`: every file of the JetClass mirror and every pretrained checkpoint still has the
# pinned size (HEAD requests), and one checkpoint downloads with the pinned MD5.

on:
  schedule:
    - cron: "17 5 * * 1"  # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  CUDA_VISIBLE_DEVICES: ""

jobs:
  network:
    name: Downloads
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[analysis,dev]"
      - name: Versions
        run: python -c "import numpy, pyarrow, torch; print('numpy', numpy.__version__, '| pyarrow', pyarrow.__version__, '| torch', torch.__version__)"
      - name: Network tests
        run: pytest -m network
