# Install once with `pre-commit install`; run on everything with `pre-commit run --all-files`.
# src/itj/configs/JetClass_*.yaml are byte-for-byte copies of the particle_transformer configs (commit fa63c86),
# trailing whitespace included, so the whitespace hooks leave them alone; ruff skips the verbatim copies in
# examples/weaver/networks through the excludes in pyproject.toml.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=3000"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
        exclude: ^src/itj/configs/JetClass_.*\.yaml$
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace
        exclude: ^src/itj/configs/JetClass_.*\.yaml$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
